<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лента тарифов</title>
    <link rel="stylesheet" href="/static/css/feed.css">
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="feed-container">
        <!-- Видео (имитация – показываем картинку, т.к. видео в MinIO может отсутствовать) -->
        <!-- В реальности используйте <video> с атрибутами autoplay muted loop -->
        <div class="feed-media" style="background-image: url('{{ .tariff.ImageURL }}');"></div>
        <!-- Или видео: <video src="{{ .tariff.VideoURL }}" autoplay muted loop></video> -->
        
        <div class="feed-overlay">
            <h1>{{ .tariff.Title }}</h1>
            <p class="desc">{{ .tariff.Description }}</p>
            <p class="specs">{{ .tariff.VCPU }} vCPU • {{ .tariff.RAM }} ГБ RAM • {{ .tariff.Disk }} ГБ SSD</p>
            <div class="price-likes">
                <span class="price">{{ .tariff.Price }} ₽/мес</span>
                <span class="likes">❤️ {{ len .tariff.Likes }}</span>
            </div>
            <a href="/feed?id={{ .tariff.ID }}&next=true" class="next-btn">Следующий →</a>
        </div>
    </div>

    <!-- Нижняя навигация -->
    <nav class="bottom-nav">
        <a href="/feed" class="active">Лента</a>
        <a href="/add">Добавление</a>
        <a href="/grid">Плитка</a>
    </nav>
</body>
</html>
