<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Лента</title>
    <link rel="stylesheet" href="/static/styles/feed.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <main class="feed-page">
            <div class="video-wrapper">
                <video src="{{ .license.VideoURL }}" autoplay muted loop playsinline></video>
                <div class="overlay">
                    <div class="top-info">
                        <h2>{{ .license.Title }}</h2>
                        <div class="desc-wrapper">
                            {{ if .showFull }}
                                <p class="desc-full">{{ .fullDesc }}</p>
                                <a href="/feed/{{ .license.ID }}" class="more-link">Меньше</a>
                            {{ else }}
                                <p class="desc-short">{{ .shortDesc }}</p>
                                <a href="/feed/{{ .license.ID }}?full=true" class="more-link">Больше</a>
                            {{ end }}
                        </div>
                        <div class="meta-row">
                            <span class="price">₽ {{ .license.PricePerUnit }} / мес</span>
                            <a href="#" class="like-btn" onclick="return false;">
                                <span class="heart">❤️</span>
                                <span class="like-count">{{ .likeCount }}</span>
                            </a>
                        </div>
                    </div>
                    <div class="bottom-actions">
                        <a href="/feed/{{ .license.ID }}?next=true" class="btn-next">Следующий</a>
                    </div>
                </div>
            </div>
        </main>

        <nav class="bottom-nav">
            <a href="/feed/1" class="nav-item active">
                <span class="label">Лента</span>
            </a>
            <a href="/add" class="nav-item">
                <span class="label">Добавление</span>
            </a>
            <a href="/grid" class="nav-item">
                <span class="label">Плитка</span>
            </a>
        </nav>
    </div>
</body>
</html>
