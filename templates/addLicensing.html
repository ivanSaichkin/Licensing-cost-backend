<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Добавление</title>
    <link rel="stylesheet" href="/static/styles/add.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <main class="add-page">
            <div class="page-title">Новая модель лицензирования</div>

            <form action="/licensings" method="POST" id="add-form">
                <!-- Изображение -->
                <details class="media-picker">
                    <summary class="media-summary">
                        <img src="{{ .imageURL }}" alt="" class="summary-thumb">
                        <span class="media-label">Изображение</span>
                        <span class="media-hint">Выбрать ▾</span>
                    </summary>
                    <div class="media-list">
                        <label class="media-option">
                            <input type="radio" name="image_url" value="http://localhost:9000/licensing-images/per_user.jpg">
                            <img src="http://localhost:9000/licensing-images/per_user.jpg" alt="" onerror="this.src='/static/img/default_image.png'">
                            <span>per_user.jpg</span>
                        </label>
                        <label class="media-option">
                            <input type="radio" name="image_url" value="http://localhost:9000/licensing-images/per_core.jpg">
                            <img src="http://localhost:9000/licensing-images/per_core.jpg" alt="" onerror="this.src='/static/img/default_image.png'">
                            <span>per_core.jpg</span>
                        </label>
                        <label class="media-option">
                            <input type="radio" name="image_url" value="http://localhost:9000/licensing-images/subscription.jpg">
                            <img src="http://localhost:9000/licensing-images/subscription.jpg" alt="" onerror="this.src='/static/img/default_image.png'">
                            <span>subscription.jpg</span>
                        </label>
                        <label class="media-option">
                            <input type="radio" name="image_url" value="http://localhost:9000/licensing-images/enterprise.jpg">
                            <img src="http://localhost:9000/licensing-images/enterprise.jpg" alt="" onerror="this.src='/static/img/default_image.png'">
                            <span>enterprise.jpg</span>
                        </label>
                        <label class="media-option">
                            <input type="radio" name="image_url" value="http://localhost:9000/licensing-images/concurrent.jpg">
                            <img src="http://localhost:9000/licensing-images/concurrent.jpg" alt="" onerror="this.src='/static/img/default_image.png'">
                            <span>concurrent.jpg</span>
                        </label>
                    </div>
                </details>

                <!-- Видео -->
                <details class="media-picker">
                    <summary class="media-summary">
                        <video src="{{ .videoURL }}" muted class="summary-thumb"></video>
                        <span class="media-label">Видео</span>
                        <span class="media-hint">Выбрать ▾</span>
                    </summary>
                    <div class="media-list">
                        <label class="media-option">
                            <input type="radio" name="video_url" value="http://localhost:9000/licensing-images/per_user.mp4">
                            <video src="http://localhost:9000/licensing-images/per_user.mp4" muted></video>
                            <span>per_user.mp4</span>
                        </label>
                        <label class="media-option">
                            <input type="radio" name="video_url" value="http://localhost:9000/licensing-images/per_core.mp4">
                            <video src="http://localhost:9000/licensing-images/per_core.mp4" muted></video>
                            <span>per_core.mp4</span>
                        </label>
                        <label class="media-option">
                            <input type="radio" name="video_url" value="http://localhost:9000/licensing-images/subscription.mp4">
                            <video src="http://localhost:9000/licensing-images/subscription.mp4" muted></video>
                            <span>subscription.mp4</span>
                        </label>
                        <label class="media-option">
                            <input type="radio" name="video_url" value="http://localhost:9000/licensing-images/enterprise.mp4">
                            <video src="http://localhost:9000/licensing-images/enterprise.mp4" muted></video>
                            <span>enterprise.mp4</span>
                        </label>
                        <label class="media-option">
                            <input type="radio" name="video_url" value="http://localhost:9000/licensing-images/concurrent.mp4">
                            <video src="http://localhost:9000/licensing-images/concurrent.mp4" muted></video>
                            <span>concurrent.mp4</span>
                        </label>
                    </div>
                </details>

                <div class="form-fields">
                    <div class="field">
                        <label>Название</label>
                        <input type="text" name="title"
                               value="{{ if .draft.Title }}{{ .draft.Title }}{{ else }}Новая модель{{ end }}">
                    </div>
                    <div class="field">
                        <label>Описание</label>
                        <textarea name="description">{{ if .draft.Description }}{{ .draft.Description }}{{ else }}Описание модели лицензирования{{ end }}</textarea>
                    </div>
                    <div class="field">
                        <label>Комиссия за 1 ед.</label>
                        <input type="text" name="commission"
                               value="{{ if .draft.CommissionPerUnit }}{{ .draft.CommissionPerUnit }}{{ else }}100{{ end }}">
                    </div>
                    <div class="field">
                        <label>Минимальное число для расчёта</label>
                        <input type="text" name="min_for_calc"
                               value="{{ if .draft.MinForCalc }}{{ .draft.MinForCalc }}{{ else }}1{{ end }}">
                    </div>
                </div>
            </form>

            {{ if eq .draft.Status "draft" }}
            <!-- Черновик уже создан → показываем "Опубликовать" -->
            <form action="/licensings/publish" method="POST">
                <input type="hidden" name="licensing_id" value="{{ .draft.ID }}">
                <button type="submit" class="cta-action">Опубликовать</button>
            </form>
            {{ else }}
            <!-- Новый черновик → показываем "Далее" -->
            <button type="submit" form="add-form" class="cta-action">Далее</button>
            {{ end }}
        </main>

        <nav class="bottom-nav">
            <a href="/licensing/1" class="nav-item">
                <span class="label">Лента</span>
            </a>
            <a href="/licensings/add" class="nav-item active">
                <span class="label">Добавление</span>
            </a>
            <a href="/licensings" class="nav-item">
                <span class="label">Плитка</span>
            </a>
        </nav>
    </div>
</body>
</html>
