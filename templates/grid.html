<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плитка тарифов</title>
    <link rel="stylesheet" href="/static/css/grid.css">
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="grid-container">
        <h1>Тарифы</h1>
        <form class="filters" action="/grid" method="GET">
            <div class="field">
                <label>Цена от (₽)</label>
                <input type="number" name="min_price" placeholder="От 1000 ₽" value="{{ .minPrice }}">
            </div>
            <button type="submit" class="filter-btn">Найти</button>
        </form>

        <div class="tariffs-grid">
            {{ range .tariffs }}
            <a href="/feed?id={{ .ID }}" class="tariff-card">
                <div class="card-image" style="background-image: url('{{ .ImageURL }}');"></div>
                <div class="card-details">
                    <h3>{{ .Title }}</h3>
                    <div class="card-footer">
                        <span class="price">{{ .Price }} ₽/мес</span>
                        <span class="likes">❤️ {{ len .Likes }}</span>
                    </div>
                </div>
            </a>
            {{ else }}
            <p class="no-tariffs">Нет тарифов, соответствующих фильтру</p>
            {{ end }}
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="/feed">Лента</a>
        <a href="/add">Добавление</a>
        <a href="/grid" class="active">Плитка</a>
    </nav>
</body>
</html>
