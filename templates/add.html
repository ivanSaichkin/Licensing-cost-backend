<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Добавление</title>
    <link rel="stylesheet" href="/static/styles/add.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <main class="add-page">
            <div class="top-module">
                <div class="page-title">Новый тариф</div>

                <!-- Поля загрузки изображения и видео -->
                <div class="upload-section">
                    <label class="upload-area image-upload" for="image-input">
                        <div class="icon-plus">+</div>
                        <span>Изображение</span>
                        <input type="file" id="image-input" accept="image/*" style="display:none;">
                    </label>
                    <label class="upload-area video-upload" for="video-input">
                        <div class="icon-plus">+</div>
                        <span>Видео</span>
                        <input type="file" id="video-input" accept="video/*" style="display:none;">
                    </label>
                </div>

                <!-- Все поля формы строго вертикально -->
                <div class="form-fields">
                    <div class="field">
                        <label>Название</label>
                        <input type="text" value="{{ .draft.Title }}">
                    </div>
                    <div class="field">
                        <label>Описание</label>
                        <textarea>{{ .draft.Description }}</textarea>
                    </div>
                    <div class="field">
                        <label>Тип лицензии</label>
                        <select>
                            <option {{if eq .draft.LicenseType "per_user"}}selected{{end}}>per_user</option>
                            <option {{if eq .draft.LicenseType "per_core"}}selected{{end}}>per_core</option>
                            <option {{if eq .draft.LicenseType "subscription"}}selected{{end}}>subscription</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Цена за единицу</label>
                        <input type="text" value="₽ {{ .draft.PricePerUnit }}">
                    </div>
                    <div class="field">
                        <label>Минимальное количество</label>
                        <input type="text" value="{{ .draft.MinQuantity }}">
                    </div>
                </div>
            </div>

            <div class="bottom-module">
                <button class="cta-action">Далее</button>
                <nav class="bottom-nav">
                    <a href="/feed/1" class="nav-item">
                        <span class="label">Лента</span>
                    </a>
                    <a href="/add" class="nav-item active">
                        <span class="label">Добавление</span>
                    </a>
                    <a href="/grid" class="nav-item">
                        <span class="label">Плитка</span>
                    </a>
                </nav>
            </div>
        </main>
    </div>
</body>
</html>
